<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plan Tygodnia</title>
  <meta name="description" content="Spokojna, minimalistyczna rozkładówka tygodniowa, nawyków i priorytetów.">
  <meta name="theme-color" content="#f8fafc" id="metaThemeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ekran blokady logowania (wymaga zalogowania do zobaczenia planera) -->
  <div class="auth-gate-overlay" id="authGateOverlay">
    <div class="auth-gate-card">
      <div class="auth-gate-brand">
        <span class="auth-gate-icon">📅</span>
        <h1 class="auth-gate-title">Plan Tygodnia</h1>
      </div>
      <p class="auth-gate-subtitle">
        Zaloguj się, aby uzyskać dostęp do swoich prywatnych planów, zadań i rutyn.
      </p>

      <button class="google-auth-btn auth-gate-google-btn" onclick="Sync.loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Kontynuuj przez Google</span>
      </button>

      <div class="auth-gate-divider">
        <span>lub e-mail</span>
      </div>

      <form class="auth-gate-form" onsubmit="event.preventDefault(); Sync.loginWithEmail(this.email.value, this.pass.value);">
        <input type="email" name="email" placeholder="Twój adres e-mail" required class="auth-gate-input">
        <input type="password" name="pass" placeholder="Hasło (min. 6 znaków)" required minlength="6" class="auth-gate-input">
        <div style="display:flex; gap:8px; width:100%;">
          <button type="submit" class="header-action-btn btn-primary" style="flex:1; justify-content:center; padding:10px;">Zaloguj się</button>
          <button type="button" class="header-action-btn" style="flex:1; justify-content:center; padding:10px;" onclick="const f=this.form; if(f.checkValidity()){ Sync.registerWithEmail(f.email.value, f.pass.value); } else { f.reportValidity(); }">Zarejestruj</button>
        </div>
      </form>
    </div>
  </div>

  <div class="app-layout">
    <!-- Górna belka: Kompas Tygodnia i nawigacja -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-brand">
          <span class="brand-icon">📅</span>
          <span class="brand-name">Plan Tygodnia</span>
        </div>

        <div class="week-nav">
          <button class="nav-arrow-btn" data-act="prevWeek" title="Poprzedni tydzień" aria-label="Poprzedni tydzień">‹</button>
          <button class="nav-range-btn" data-act="currentWeek" id="weekRangeLabel">Bieżący tydzień</button>
          <button class="nav-arrow-btn" data-act="nextWeek" title="Następny tydzień" aria-label="Następny tydzień">›</button>
        </div>
      </div>

      <!-- Kompas tygodnia: Główny cel tygodnia -->
      <div class="header-center">
        <div class="week-goal-pill" id="weekGoalPill" title="Kliknij, aby ustalić lub edytować główny cel tego tygodnia">
          <span class="goal-icon">🎯</span>
          <input class="week-goal-input" id="weekGoalInput" placeholder="Główny cel tego tygodnia (np. Oddać rozdział 2 licencjatu)..." maxlength="120" autocomplete="off">
        </div>
      </div>

      <div class="header-right">
        <button class="header-action-btn btn-subtle" id="btnToggleCompleted" data-act="toggleCompletedSidebar" title="Pokaż / Ukryj listę wykonanych dni">
          <span>✅ Wykonane</span>
          <span class="inbox-pill-count" id="completedCountBadge">0</span>
        </button>
        <button class="header-action-btn btn-primary" data-act="openNewTaskModal" title="Dodaj nowe zadanie">+ Zadanie</button>
        <button class="header-action-btn btn-subtle" data-act="openRoutinesModal" title="Cykliczne rutyny i ostrzenie piły">🪚 Rutyny & Cykle</button>
        <button class="header-action-btn btn-inbox-toggle" id="btnToggleSidebar" data-act="toggleInboxSidebar" title="Pokaż / Ukryj Skrzynkę myśli">
          <span>📥 Skrzynka</span>
          <span class="inbox-pill-count" id="inboxCountBadge">0</span>
        </button>
        <button class="icon-circle-btn theme-toggle" id="btnThemeToggle" title="Przełącz motyw (Jasny / Ciemny)" aria-label="Przełącz motyw"></button>
        <button class="icon-circle-btn" data-act="openSettings" title="Ustawienia i kopia zapasowa" aria-label="Ustawienia">⚙️</button>
      </div>
    </header>

    <!-- Główna przestrzeń: Lewy panel Wykonane + Rozkładówka 7 dni + Prawy panel Skrzynki -->
    <div class="spread-container" id="spreadContainer">
      <!-- LEWA STRONA: BOCZNY PANEL WYKONANYCH DNI -->
      <aside class="completed-sidebar is-collapsed" id="completedSidebar"></aside>

      <!-- ŚRODEK: 7 DNI TYGODNIA W ZASIĘGU WZROKU -->
      <main class="board-main" id="boardMain">
        <div class="week-grid" id="weekDaysGrid">
          <!-- 7 kolumn tygodnia generowanych przez JS -->
        </div>
      </main>

      <!-- PRAWA STRONA: BOCZNY PANEL SKRZYNKI MYŚLI (I - III) -->
      <aside class="inbox-sidebar" id="inboxSidebar">
        <!-- Generowany dynamicznie przez JS -->
      </aside>
    </div>
  </div>

  <!-- Modale i powiadomienia -->
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <!-- Firebase SDK (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <!-- Skrypty aplikacji -->
  <script src="js/utils.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
