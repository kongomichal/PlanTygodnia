<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plan Tygodnia</title>
  <meta name="description" content="Spokojna, minimalistyczna rozkładówka tygodniowa, nawyków i priorytetów.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plan Tygodnia">
  <meta name="application-name" content="Plan Tygodnia">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f1f5f9">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=10.3">

  <script>
    // Wyrejestrowanie Service Workera i usunięcie cache (jak w Muraven - zapobiega ładowaniu starego kodu)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) reg.unregister();
      });
      if (window.caches) {
        caches.keys().then(keys => {
          for (const k of keys) caches.delete(k);
        });
      }
    }
  </script>

  <script>
    // Natychmiastowe przywrócenie sesji bez migania ekranu logowania
    try {
      if (localStorage.getItem('kompas_auth_active') === '1') {
        document.documentElement.classList.add('is-authenticated');
      }
    } catch(e) {}
  </script>

  <!-- Dedykowane, wbudowane style ekranu logowania (brak ryzyka błędu cache) -->
  <style>
    /* Natychmiastowe ukrycie bramki logowania gdy użytkownik jest już zalogowany */
    html.is-authenticated #screenAuth {
      display: none !important;
    }
    html.is-authenticated #screenApp {
      display: flex !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f1f5f9;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    [data-theme="dark"] body {
      background: #090d16;
      color: #f8fafc;
    }

    /* 1. EKRAN WEJŚCIA / BRAMKA LOGOWANIA */
    #screenAuth {
      position: fixed;
      inset: 0;
      width: 100%;
      width: 100vw;
      width: 100dvw;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 45%, #090d16 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top, 20px)) max(16px, env(safe-area-inset-right, 16px)) max(20px, env(safe-area-inset-bottom, 20px)) max(16px, env(safe-area-inset-left, 16px));
      box-sizing: border-box;
      z-index: 999999;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .auth-portal-card {
      margin: auto;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 38px 30px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: center;
      box-sizing: border-box;
      animation: authCardIn 0.35s ease-out;
    }

    @keyframes authCardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-portal-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .auth-portal-icon {
      font-size: 2.2rem;
      line-height: 1;
    }

    .auth-portal-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      color: #ffffff;
    }

    .auth-portal-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 26px 0;
    }

    .btn-portal-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #ffffff;
      color: #0f172a;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      min-height: 48px;
    }

    .btn-portal-google:hover {
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .btn-portal-google:active {
      transform: translateY(0);
    }

    .auth-portal-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
    }

    .auth-portal-divider::before,
    .auth-portal-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    .auth-portal-divider span {
      font-size: 0.74rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .auth-portal-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
    }

    .portal-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 16px; /* Zapobiega automatycznemu powiększaniu na iOS Safari */
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s;
      min-height: 46px;
    }

    .portal-input:focus {
      border-color: #6366f1;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .portal-input::placeholder {
      color: #64748b;
    }

    .portal-btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .btn-portal-submit {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #4f46e5;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 46px;
    }

    .btn-portal-submit:hover {
      background: #4338ca;
    }

    .btn-portal-register {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: transparent;
      color: #e2e8f0;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 46px;
    }

    .btn-portal-register:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .auth-portal-footer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      color: #64748b;
      margin-top: 22px;
    }

    .auth-error-box {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.84rem;
      line-height: 1.45;
      margin-bottom: 20px;
      text-align: left;
    }

    @media (max-width: 480px) {
      #screenAuth {
        padding: max(16px, env(safe-area-inset-top, 16px)) 12px max(20px, env(safe-area-inset-bottom, 20px)) 12px;
        align-items: flex-start;
      }
      .auth-portal-card {
        padding: 26px 18px;
        border-radius: 20px;
        margin: auto 0;
      }
      .auth-portal-icon {
        font-size: 1.8rem;
      }
      .auth-portal-title {
        font-size: 1.45rem;
      }
      .auth-portal-subtitle {
        font-size: 0.82rem;
        margin-bottom: 20px;
      }
    }

    /* 2. GŁÓWNY EKRAN PLANERA - CAŁKOWICIE UKRYTY DOMYŚLNIE */
    #screenApp {
      display: none;
    }
  </style>
</head>
<body>
  <!-- ============================================================== -->
  <!-- 1. BRAMKA LOGOWANIA (OSOBNY EKRAN WEJŚCIA)                       -->
  <!-- ============================================================== -->
  <div id="screenAuth">
    <div class="auth-portal-card">
      <div class="auth-portal-brand">
        <span class="auth-portal-icon">📅</span>
        <h1 class="auth-portal-title">Plan Tygodnia</h1>
      </div>
      <p class="auth-portal-subtitle">
        Twój osobisty planer tygodnia, rutyn i priorytetów. Zaloguj się, aby uzyskać dostęp do swoich zadań.
      </p>

      <!-- Komunikat o ewentualnym błędzie logowania -->
      <div id="authErrorBox" class="auth-error-box" style="display:none;"></div>

      <!-- Logowanie Google jednym kliknięciem -->
      <button class="btn-portal-google" id="btnPortalGoogle" onclick="handleAuthAction('google')">
        <svg width="20" height="20" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        <span id="btnPortalGoogleText">Kontynuuj przez Google</span>
      </button>

      <div class="auth-portal-divider">
        <span>lub adres e-mail</span>
      </div>

      <div class="auth-portal-form">
        <input type="email" id="authPortalEmail" placeholder="Twój adres e-mail" class="portal-input" autocomplete="username">
        <input type="password" id="authPortalPass" placeholder="Hasło (min. 6 znaków)" class="portal-input" autocomplete="current-password" onkeydown="if(event.key==='Enter') handleAuthAction('login');">
        <div class="portal-btn-row">
          <button type="button" class="btn-portal-submit" id="btnPortalEmailSubmit" onclick="handleAuthAction('login')">Zaloguj się</button>
          <button type="button" class="btn-portal-register" id="btnPortalEmailRegister" onclick="handleAuthAction('register')">Zarejestruj</button>
        </div>
      </div>

      <div style="margin-top:16px;">
        <button type="button" style="background:transparent; border:none; color:#94a3b8; font-size:0.78rem; text-decoration:underline; cursor:pointer;" onclick="handleAuthAction('offline')">
          Przejdź w trybie lokalnym / offline (bez logowania) ➔
        </button>
      </div>

      <div class="auth-portal-footer">
        <span>🔒</span>
        <span>Bezpieczna synchronizacja Google Firebase</span>
      </div>
    </div>
  </div>

  <!-- ============================================================== -->
  <!-- 2. GŁÓWNY EKRAN PLANERA (WŁĄCZANY DOPIERO PO ZALOGOWANIU)        -->
  <!-- ============================================================== -->
  <div id="screenApp" class="app-layout">
    <!-- Górna belka: Kompas Tygodnia i nawigacja -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-brand">
          <span class="brand-icon">📅</span>
          <span class="brand-name">Plan Tygodnia</span>
        </div>

        <div class="week-nav">
          <button class="nav-arrow-btn" data-act="prevWeek" title="Poprzedni tydzień" aria-label="Poprzedni tydzień">‹</button>
          <button class="nav-range-btn" data-act="currentWeek" id="weekRangeLabel">Bieżący tydzień</button>
          <button class="nav-arrow-btn" data-act="nextWeek" title="Następny tydzień" aria-label="Następny tydzień">›</button>
        </div>
      </div>

      <div class="header-right">
        <button class="header-action-btn btn-subtle" id="btnToggleCompleted" data-act="toggleCompletedSidebar" title="Pokaż / Ukryj listę wykonanych dni">
          <span>✅ Wykonane</span>
          <span class="inbox-pill-count" id="completedCountBadge">0</span>
        </button>
        <button class="header-action-btn btn-primary" data-act="openNewTaskModal" title="Dodaj nowe zadanie">+ Zadanie</button>
        <button class="header-action-btn btn-subtle" data-act="openRoutinesModal" title="Cykliczne rutyny i ostrzenie piły">🪚 Rutyny & Cykle</button>
        <button class="header-action-btn btn-inbox-toggle" id="btnToggleSidebar" data-act="toggleInboxSidebar" title="Pokaż / Ukryj Skrzynkę myśli">
          <span>📥 Skrzynka</span>
          <span class="inbox-pill-count" id="inboxCountBadge">0</span>
        </button>
        <button class="icon-circle-btn theme-toggle" id="btnThemeToggle" title="Przełącz motyw (Jasny / Ciemny)" aria-label="Przełącz motyw"></button>
        <button class="icon-circle-btn" data-act="openSettings" title="Ustawienia i kopia zapasowa" aria-label="Ustawienia">⚙️</button>
      </div>
    </header>

    <!-- Pasek wyboru dni tygodnia dla urządzeń mobilnych -->
    <div class="mobile-day-strip" id="mobileDayStrip"></div>

    <!-- Główna przestrzeń: Lewy panel Wykonane + Rozkładówka 7 dni + Prawy panel Skrzynki -->
    <div class="spread-container" id="spreadContainer">
      <!-- LEWA STRONA: BOCZNY PANEL WYKONANYCH DNI -->
      <aside class="completed-sidebar is-collapsed" id="completedSidebar"></aside>

      <!-- ŚRODEK: 7 DNI TYGODNIA W ZASIĘGU WZROKU -->
      <main class="board-main" id="boardMain">
        <div class="week-grid" id="weekDaysGrid">
          <!-- 7 kolumn tygodnia generowanych przez JS -->
        </div>
      </main>

      <!-- PRAWA STRONA: BOCZNY PANEL SKRZYNKI MYŚLI (I - III) -->
      <aside class="inbox-sidebar" id="inboxSidebar">
        <!-- Generowany dynamicznie przez JS -->
      </aside>
    </div>

    <!-- Dolny pasek nawigacyjny na telefon (Mobile Bottom Nav) -->
    <nav class="mobile-bottom-bar" id="mobileBottomBar">
      <button class="mobile-nav-btn active" data-act="mobileNavPlan" id="mNavPlan">
        <span class="m-nav-icon">📅</span>
        <span class="m-nav-label">Planer</span>
      </button>
      <button class="mobile-nav-btn" data-act="toggleInboxSidebar" id="mNavInbox">
        <div class="m-nav-icon-wrap">
          <span class="m-nav-icon">📥</span>
          <span class="m-nav-badge" id="mInboxBadge" style="display:none;">0</span>
        </div>
        <span class="m-nav-label">Skrzynka</span>
      </button>
      <button class="mobile-nav-fab" data-act="openNewTaskModal" id="mNavAdd" title="Dodaj nowe zadanie" aria-label="Dodaj nowe zadanie">
        <span class="m-fab-icon">+</span>
      </button>
      <button class="mobile-nav-btn" data-act="openRoutinesModal" id="mNavRoutines">
        <span class="m-nav-icon">🪚</span>
        <span class="m-nav-label">Rutyny</span>
      </button>
      <button class="mobile-nav-btn" data-act="openSettings" id="mNavSettings">
        <span class="m-nav-icon">⚙️</span>
        <span class="m-nav-label">Ustawienia</span>
      </button>
    </nav>
  </div>

  <!-- Modale i powiadomienia -->
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <!-- Firebase SDK (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=10.3"></script>

  <!-- Skrypty aplikacji -->
  <script src="js/utils.js?v=10.3"></script>
  <script src="js/seed.js?v=10.3"></script>
  <script src="js/sync.js?v=10.3"></script>
  <script src="js/store.js?v=10.3"></script>
  <script src="js/app.js?v=10.3"></script>

  <!-- Niezależna od cache obsługa bramki wejściowej -->
  <script>
    window.handleAuthAction = async function(type) {
      const errorBox = document.getElementById('authErrorBox');
      const emailEl = document.getElementById('authPortalEmail');
      const passEl = document.getElementById('authPortalPass');
      const btnSubmit = document.getElementById('btnPortalEmailSubmit');
      const btnRegister = document.getElementById('btnPortalEmailRegister');
      const btnGoogle = document.getElementById('btnPortalGoogle');
      const googleText = document.getElementById('btnPortalGoogleText');

      function showError(msg) {
        if (errorBox) {
          errorBox.textContent = msg;
          errorBox.style.display = 'block';
        } else {
          alert(msg);
        }
      }
      function clearError() {
        if (errorBox) {
          errorBox.textContent = '';
          errorBox.style.display = 'none';
        }
      }

      clearError();

      // Awaryjny tryb offline
      if (type === 'offline') {
        document.getElementById('screenAuth').style.display = 'none';
        document.getElementById('screenApp').style.display = 'flex';
        if (window.App && typeof window.App.renderAll === 'function') window.App.renderAll();
        return;
      }

      // Inicjalizacja Firebase jeśli jeszcze nie wystartował
      if (!window.firebase || !firebase.apps || !firebase.apps.length) {
        try {
          if (window.FIREBASE_CONFIG) firebase.initializeApp(window.FIREBASE_CONFIG);
        } catch(e) {
          showError('Błąd konfiguracji Firebase: ' + e.message);
          return;
        }
      }

      const auth = firebase.auth();

      function setAuthSuccess() {
        try { localStorage.setItem('kompas_auth_active', '1'); } catch(e){}
        document.documentElement.classList.add('is-authenticated');
        const screenAuth = document.getElementById('screenAuth');
        const screenApp = document.getElementById('screenApp');
        if (screenAuth) screenAuth.style.display = 'none';
        if (screenApp) screenApp.style.display = 'flex';
        if (window.Sync && typeof window.Sync.listenToUserDoc === 'function') {
          window.Sync.listenToUserDoc();
        }
        const app = (window.App || (typeof App !== 'undefined' ? App : null));
        if (app && typeof app.renderAll === 'function') app.renderAll();
      }

      // Logowanie Google
      if (type === 'google') {
        if (btnGoogle) btnGoogle.disabled = true;
        if (googleText) googleText.textContent = 'Otwieranie Google...';
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        try {
          const res = await auth.signInWithPopup(provider);
          if (res && res.user) setAuthSuccess();
        } catch (err) {
          console.error('Google Auth Error:', err);
          if (err.code === 'auth/popup-blocked') {
            try {
              await auth.signInWithRedirect(provider);
              return;
            } catch(e2) {
              showError('Błąd logowania Google: ' + e2.message);
            }
          } else if (err.code === 'auth/unauthorized-domain') {
            showError('⚠️ Domena kongomichal.github.io nie została dodana w Firebase Console! Dodaj ją w Authentication -> Settings -> Authorized domains.');
          } else {
            showError('Błąd Google: ' + (err.message || err.code));
          }
        } finally {
          if (btnGoogle) btnGoogle.disabled = false;
          if (googleText) googleText.textContent = 'Kontynuuj przez Google';
        }
        return;
      }

      const email = emailEl ? emailEl.value.trim() : '';
      const pass = passEl ? passEl.value : '';

      if (!email) {
        showError('Wpisz swój adres e-mail.');
        if (emailEl) emailEl.focus();
        return;
      }
      if (!pass) {
        showError('Wpisz hasło.');
        if (passEl) passEl.focus();
        return;
      }

      // Logowanie E-mail
      if (type === 'login') {
        if (btnSubmit) { btnSubmit.disabled = true; btnSubmit.textContent = 'Logowanie...'; }
        try {
          const res = await auth.signInWithEmailAndPassword(email, pass);
          if (res && res.user) setAuthSuccess();
        } catch (err) {
          console.warn('Login email error:', err);
          if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
            // Automatyczna rejestracja nowego konta
            try {
              const regRes = await auth.createUserWithEmailAndPassword(email, pass);
              if (regRes && regRes.user) setAuthSuccess();
              return;
            } catch (regErr) {
              if (regErr.code === 'auth/email-already-in-use') {
                showError('Niepoprawne hasło dla tego konta.');
              } else if (regErr.code === 'auth/weak-password') {
                showError('Hasło musi mieć co najmniej 6 znaków.');
              } else if (regErr.code === 'auth/operation-not-allowed') {
                showError('⚠️ Logowanie przez E-mail nie zostało włączone w Firebase Console! Włącz je w Authentication -> Sign-in method -> Email/Password.');
              } else {
                showError('Błąd: ' + regErr.message);
              }
              return;
            }
          } else if (err.code === 'auth/operation-not-allowed') {
            showError('⚠️ Logowanie przez E-mail nie zostało włączone w Firebase Console! Włącz je w Authentication -> Sign-in method -> Email/Password.');
          } else {
            showError('Błąd: ' + (err.message || err.code));
          }
        } finally {
          if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.textContent = 'Zaloguj się'; }
        }
      } else if (type === 'register') {
        if (btnRegister) { btnRegister.disabled = true; btnRegister.textContent = 'Rejestracja...'; }
        try {
          const regRes = await auth.createUserWithEmailAndPassword(email, pass);
          if (regRes && regRes.user) setAuthSuccess();
        } catch (err) {
          if (err.code === 'auth/email-already-in-use') {
            showError('Konto z tym adresem już istnieje. Wpisz hasło i kliknij "Zaloguj się".');
          } else if (err.code === 'auth/weak-password') {
            showError('Hasło musi mieć minimum 6 znaków.');
          } else if (err.code === 'auth/operation-not-allowed') {
            showError('⚠️ Logowanie E-mail nie jest włączone w Firebase Console!');
          } else {
            showError('Błąd: ' + err.message);
          }
        } finally {
          if (btnRegister) { btnRegister.disabled = false; btnRegister.textContent = 'Zarejestruj'; }
        }
      }
    };
  </script>
</body>
</html>
